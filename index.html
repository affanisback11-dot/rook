let wk=null;
V_.train=()=>{const pl=D.plans;
V('<h2>Train</h2><div class="bx"><h3>AI plan</h3><select id="mn"><option>20</option><option>30</option><option selected>45</option></select><p class="mu">Minutes per session, built from your goals, level and equipment.</p><button id="gp">Build my plan</button><p id="e" class="err"></p></div>'
+(pl.length?'<div class="bx"><h3>My plans</h3>'+pl.map((p,i)=>'<div class="hr"><b>'+esc(p.name)+'</b><button class="s" data-s="'+i+'">Start</button><button class="g s" data-d="'+i+'" aria-label="Delete plan">✕</button></div>').join("")+"</div>":"")
+'<div class="bx"><h3>Library</h3>'+Object.keys(LIB).map(k=>"<details><summary>"+k+"</summary>"+LIB[k].map(x=>'<div class="ex"><b>'+esc(x.n)+"</b> "+x.s+"×"+esc(x.r)+'<div class="mu">'+esc(x.tip)+"</div></div>").join("")+'<button class="s" data-l="'+k+'">Start this</button></details>').join("")+"</div>"
+(Object.keys(D.pb).length?'<div class="bx"><h3>Personal bests</h3>'+Object.keys(D.pb).map(k=>'<div class="hr"><b>'+esc(k)+"</b>"+D.pb[k]+" "+(D.set.units==="metric"?"kg":"lb")+"</div>").join("")+"</div>":""));
$$("[data-s]").forEach(b=>b.onclick=()=>{wk=pl[b.dataset.s];go("wk")});
$$("[data-l]").forEach(b=>b.onclick=()=>{wk={name:b.dataset.l,ex:LIB[b.dataset.l]};go("wk")});
$$("[data-d]").forEach(b=>b.onclick=()=>{D.plans.splice(+b.dataset.d,1);save();go("train")});
$("#gp").onclick=async()=>{const e=$("#e");e.textContent="";if(!S){e.textContent=aiErr();return}$("#gp").disabled=true;$("#gp").textContent="Building…";
try{const o=await S(ctx()+" Build one workout of about "+$("#mn").value+" minutes suited to this person’s equipment and level. Reply with ONLY JSON: {\"name\":\"short title\",\"ex\":[{\"n\":\"exercise\",\"s\":3,\"r\":\"10\",\"tip\":\"one short form cue\"}]}",{cache:false});
const d=pj(o.text);D.plans.push({name:d.name,ex:d.ex});save();go("train")}catch(x){e.textContent=x&&x.code?aiErr(x):"Couldn’t read the plan. Try again.";$("#gp").disabled=false;$("#gp").textContent="Build my plan"}}};
let tm=null;
V_.wk=()=>{if(!wk)return go("train");const u=D.set.units==="metric"?"kg":"lb";
V('<h2>'+esc(wk.name)+'</h2>'+(D.set.proof!==0?'<p class="mu">Camera proof mode is on: tap 📷 Check to log each set. Turn it off in Settings to tick sets by hand.</p>':"")+wk.ex.map((x,i)=>'<div class="bx"><b>'+esc(x.n)+"</b> · "+x.s+" × "+esc(x.r)+'<button class="g s" data-v="'+i+'" style="float:right" aria-label="Verify with camera">📷 Check</button><div class="mu">'+esc(x.tip)+'</div><div class="row" style="margin-top:8px">'+Array.from({length:Math.max(1,+x.s||1)},()=>'<input type="checkbox" style="width:26px;height:26px;accent-color:var(--acc)" aria-label="Set done"'+(D.set.proof!==0?" disabled":"")+'>').join("")+'<input type="number" inputmode="decimal" data-w="'+i+'" placeholder="'+u+(D.pb[x.n]?" (best "+D.pb[x.n]+")":"")+'" style="max-width:150px"></div></div>').join("")
+'<button class="rest" id="rt">Rest 60s</button><div class="row"><button id="fn">Finish workout</button><button class="g" id="cn">Cancel</button></div>');
$("#rt").onclick=()=>{clearInterval(tm);let n=60;$("#rt").textContent="Rest "+n+"s";tm=setInterval(()=>{n--;if(!$("#rt")||n<=0){clearInterval(tm);if($("#rt"))$("#rt").textContent="Rest over. Go!";return}$("#rt").textContent="Rest "+n+"s"},1000)};
$("#cn").onclick=()=>{clearInterval(tm);go("train")};
$$("[data-v]").forEach(b=>b.onclick=()=>verify(wk.ex[b.dataset.v].n+" (exercise, "+wk.ex[b.dataset.v].r+")",()=>{const c=[...b.closest(".bx").querySelectorAll('input[type=checkbox]')].find(x=>!x.checked);if(c)c.checked=true}));
$("#fn").onclick=()=>{clearInterval(tm);$$("[data-w]").forEach(i=>{const v=parseFloat(i.value),n=wk.ex[i.dataset.w].n;if(v>0&&v>(D.pb[n]||0))D.pb[n]=v});D.wc++;
const t=dk(new Date());D.log[t]=D.log[t]||{};const w=D.habits.find(h=>/workout/i.test(h.name));if(w)D.log[t][w.id]=w.target;save();go("train")}};

/* habits */
let hed=false;
const hdone=(day)=>D.habits.length&&D.habits.filter(h=>((D.log[day]||{})[h.id]||0)>=h.target).length>=Math.ceil(D.habits.length/2);
function streak(){let n=0,d=new Date();if(!hdone(dk(d)))d.setDate(d.getDate()-1);while(hdone(dk(d))){n++;d.setDate(d.getDate()-1)}return n}
function week(){let t=0;for(let i=0;i<7;i++){const d=new Date();d.setDate(d.getDate()-i);const l=D.log[dk(d)]||{};t+=D.habits.length?D.habits.reduce((a,h)=>a+Math.min(1,(l[h.id]||0)/h.target),0)/D.habits.length:0}return Math.round(t/7*100)}
V_.habits=()=>{const t=dk(new Date()),l=D.log[t]||{},pc=week();
V('<h2>Habits</h2><div class="bx row"><svg width="84" height="84" viewBox="0 0 84 84" role="img" aria-label="Week '+pc+' percent"><circle cx="42" cy="42" r="34" fill="none" stroke="var(--ln)" stroke-width="9"/><circle cx="42" cy="42" r="34" fill="none" stroke="var(--acc)" stroke-width="9" stroke-linecap="round" stroke-dasharray="'+(2.137*pc)+' 214" transform="rotate(-90 42 42)"/><text x="42" y="48" text-anchor="middle" font-size="18" font-weight="800" fill="currentColor">'+pc+'%</text></svg><div><h1>'+streak()+'</h1><span class="mu">day streak · week done</span></div></div>'
+'<div class="bx">'+D.habits.map((h,i)=>hed?'<div class="hr"><input type="text" data-n="'+i+'" value="'+esc(h.name)+'" aria-label="Habit name" style="margin:0"><input type="number" data-t="'+i+'" value="'+h.target+'" min="1" aria-label="Daily target" style="max-width:70px;margin:0"><button class="g s" data-u="'+i+'" aria-label="Move up">↑</button><button class="g s" data-x="'+i+'" aria-label="Delete">✕</button></div>'
:'<div class="hr"><b>'+esc(h.name)+'</b><button class="g s" data-m="'+i+'" aria-label="Minus">−</button><span>'+(l[h.id]||0)+"/"+h.target+'</span><button class="g s" data-v="'+i+'" aria-label="Verify with camera">📷</button><button class="s" data-p="'+i+'" aria-label="Plus">+</button></div>').join("")
+(hed?'<div class="row" style="margin-top:10px"><input type="text" id="nh" placeholder="New habit"><button id="ah">Add</button></div>':"")+'</div><div class="row"><button class="g" id="ed">'+(hed?"Done editing":"Edit habits")+'</button><button class="g" id="rv">Weekly review</button></div><p id="e" class="err"></p><div id="rvt" class="m a" style="display:none;max-width:100%"></div>');
const set=(i,v)=>{const h=D.habits[i];D.log[t]=D.log[t]||{};D.log[t][h.id]=Math.max(0,Math.min(h.target*2,v));save();go("habits")};
$$("[data-p]").forEach(b=>b.onclick=()=>{const i=+b.dataset.p,go1=()=>set(i,(l[D.habits[i].id]||0)+1);D.set.proof!==0?verify(D.habits[i].name,go1):go1()});
$$("[data-v]").forEach(b=>b.onclick=()=>verify(D.habits[b.dataset.v].name,()=>set(+b.dataset.v,(l[D.habits[b.dataset.v].id]||0)+1)));$$("[data-m]").forEach(b=>b.onclick=()=>set(+b.dataset.m,(l[D.habits[b.dataset.m].id]||0)-1));
$$("[data-n]").forEach(i=>i.onchange=()=>{D.habits[i.dataset.n].name=i.value.trim()||D.habits[i.dataset.n].name;save()});$$("[data-t]").forEach(i=>i.onchange=()=>{D.habits[i.dataset.t].target=Math.max(1,+i.value||1);save()});
$$("[data-u]").forEach(b=>b.onclick=()=>{const i=+b.dataset.u;if(i>0){[D.habits[i-1],D.habits[i]]=[D.habits[i],D.habits[i-1]];save();go("habits")}});
$$("[data-x]").forEach(b=>b.onclick=()=>{D.habits.splice(+b.dataset.x,1);save();go("habits")});
if(hed)$("#ah").onclick=()=>{const v=$("#nh").value.trim();if(v){D.habits.push({id:"h"+Date.now(),name:v,target:1});save();go("habits")}};
$("#ed").onclick=()=>{hed=!hed;go("habits")};
$("#rv").onclick=async()=>{const e=$("#e");e.textContent="";if(!S){e.textContent=aiErr();return}$("#rv").disabled=true;
const sm=[];for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);const q=D.log[dk(d)]||{};sm.push(dk(d)+": "+D.habits.map(h=>h.name+" "+(q[h.id]||0)+"/"+h.target).join(", "))}
try{const o=await S(ctx()+" Here is the last 7 days of habit tracking:\n"+sm.join("\n")+"\nIn under 100 words: what went well, and the one thing to fix next week with a concrete tactic.",{cache:false});const r=$("#rvt");r.style.display="block";r.textContent=o.text}
catch(x){e.textContent=aiErr(x)}finally{$("#rv").disabled=false}}};

/* camera sheet */
function snap(face,skip){return new Promise(res=>{const ov=document.createElement("div");ov.className="cam";
ov.innerHTML='<h2>Take a photo</h2><p class="cm">Tap Open camera, take the photo, then confirm it.</p><div class="row"><label class="fb big">Open camera<input type="file" id="cp" accept="image/*" capture="'+(face?"user":"environment")+'" hidden></label><label class="fb">Gallery<input type="file" id="cg" accept="image/*" hidden></label></div><div class="row"><button class="g" id="cx">Cancel</button>'+(skip?'<button class="g" id="sk">Count without proof</button>':"")+'</div>';
document.body.appendChild(ov);const msg=ov.querySelector(".cm");let done=false;
const end=b=>{if(done)return;done=true;ov.remove();res(b)};
const got=async e=>{const f=e.target.files[0];if(!f)return;msg.textContent="Loading photo…";try{end(await shrink(f,900,.8))}catch(x){msg.textContent="Couldn’t read that photo. Try another."}};
ov.querySelector("#cp").onchange=got;ov.querySelector("#cg").onchange=got;ov.querySelector("#cx").onclick=()=>end(null);
const sk=ov.querySelector("#sk");if(sk)sk.onclick=()=>end("skip")})}

document.body.appendChild(ov);const v=ov.querySelector("video"),msg=ov.querySelector(".cm");let st=null,done=false;

if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia){fail("Live camera isn’t available here. Try Photo picker.");return}
msg.textContent="Starting camera…";setTimeout(()=>{if(!done&&!v.videoWidth)fail("Live view didn’t start. Tap Take photo to use your camera app.")},5000);
navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:face?"user":"environment"}},audio:false}).then(s=>{if(done){s.getTracks().forEach(t=>t.stop());return}st=s;v.srcObject=s;msg.textContent="";v.onclick=()=>v.play().catch(()=>{});v.play().catch(()=>{})}).catch(e=>fail("Camera blocked ("+((e&&e.name)||"error")+")."))})}

/* camera check */
async function verify(task,cb){const m=$("#vm");const hide=()=>setTimeout(()=>{m.style.display="none"},6000);
const f=await snap(0,1);if(!f)return;if(f==="skip"){cb();return}{m.style.display="block";
if(!S){m.textContent=aiErr();hide();return}m.textContent="Checking…";
try{if(!(await S.limits()).images){m.textContent="Photo checks aren’t enabled for you yet.";hide();return}
const b=f;
const o=await S("You verify task completion from a photo. Task: \""+task+"\". Look for clear visual evidence the task was done or is being done right now (for example the person mid-exercise, a finished setup, a glass of water, an open book). If the photo doesn’t clearly show it, it is not verified. Reply with ONLY JSON: {\"done\":true or false,\"reason\":\"one short sentence\"}",{images:[b],cache:false});
const d=pj(o.text);m.textContent=(d.done?"Verified: ":"Not verified: ")+d.reason;if(d.done)cb();hide()}
catch(x){m.textContent=x&&x.code?aiErr(x):"Couldn’t check that photo. Try again.";hide()}}}

/* ranks */
const pts=()=>D.wc*10+streak()*5+D.scores.length*3+Object.keys(D.log).filter(hdone).length*2;
V_.ranks=()=>{V('<h2>Global ranks</h2><p class="mu">10 points per workout, 5 per streak day, 3 per photo rating, 2 per full habit day. Joining shows only your nickname and points.</p><div class="bx"><div class="sc">'+pts()+'<small> pts</small></div><input type="text" id="nk" placeholder="Pick a nickname" maxlength="20" value="'+esc(D.nick||"")+'" aria-label="Nickname" style="margin-top:10px"><button id="jn">'+(D.nick?"Update my rank":"Join ranks")+'</button><p id="e" class="err"></p></div><div class="bx" id="bd"><p class="mu">Loading…</p></div>');
$("#jn").onclick=async()=>{const n=$("#nk").value.trim().slice(0,20);if(!n){$("#e").textContent="Pick a nickname first.";return}
if(!SY.db){$("#e").textContent="Sign in with Google to join.";return}
try{await SY.db.doc("board/"+SY.id).set({nick:n,pts:pts(),ts:Date.now()});D.nick=n;save();go("ranks")}catch(x){$("#e").textContent="Couldn’t join. Try again."}};
board()};
async function board(){const el=$("#bd");if(!el)return;if(!SY.db){el.innerHTML='<p class="mu">Sign in with Google to see the board.</p>';return}
try{if(D.nick){try{await SY.db.doc("board/"+SY.id).set({nick:D.nick,pts:pts(),ts:Date.now()})}catch(e){}}
const q=await SY.db.collection("board").orderBy("pts","desc").limit(50).get();
el.innerHTML=q.docs.length?'<h3>Top players</h3>'+q.docs.map((d,i)=>{const x=d.data();return'<div class="hr"><span class="mu" style="width:26px">'+(i+1)+'</span><b>'+esc(x.nick)+(d.id===SY.id?" (you)":"")+'</b>'+esc(x.pts)+"</div>"}).join(""):'<p class="mu">No one has joined yet. Be first.</p>'}
catch(x){el.innerHTML='<p class="mu">Couldn’t load the board. Try again later.</p>'}}

/* me */
V_.me=()=>{const u=D.set.units==="metric"?"kg":"lb",w=D.weights,st=streak(),sc=D.scores.length;
const B=[["First rating",sc>=1],["5 ratings",sc>=5],["7-day streak",st>=7],["10 workouts",D.wc>=10],["30-day streak",st>=30]];
V('<h2>Me</h2><div class="bx"><h3>Badges</h3>'+B.map(b=>'<span class="bd'+(b[1]?" on":"")+'">'+b[0]+"</span>").join("")+'<p class="mu">'+D.wc+" workouts finished · "+sc+" photo ratings</p></div>"
+'<div class="bx"><h3>Weight ('+u+')</h3>'+spark(w.map(x=>x.v))+'<div class="row"><input type="number" inputmode="decimal" id="wv" placeholder="Today’s weight"><button id="aw">Log</button></div>'+w.slice(-5).reverse().map(x=>'<div class="hr"><b>'+new Date(x.t).toLocaleDateString()+"</b>"+x.v+" "+u+"</div>").join("")+"</div>"
+'<div class="bx"><h3>Photo score trend</h3>'+spark(D.scores.map(x=>x.s))+"</div>");
$("#aw").onclick=()=>{const v=parseFloat($("#wv").value);if(v>0){D.weights.push({t:Date.now(),v});save();go("me")}}};

/* settings */
V_.set=()=>{const s=D.set,o=(a,v)=>a.map(x=>"<option"+(x===v?" selected":"")+">"+x+"</option>").join("");
V('<h2>Settings</h2><div class="bx"><h3>Look</h3><select id="th">'+o(["auto","light","dark"],s.theme)+'</select><label class="row" style="margin-bottom:8px">Accent color <input type="color" id="ac" value="'+s.acc+'" style="width:56px;height:38px;border:0;padding:0;background:none"></label><select id="un">'+o(["metric","imperial"],s.units)+'</select><label class="row" style="padding:6px 0"><input type="checkbox" id="pf"'+(s.proof!==0?" checked":"")+' style="width:22px;height:22px"> Camera proof mode</label></div>'
+'<div class="bx"><h3>Show tabs</h3>'+Object.keys(TABS).map(k=>'<label class="row" style="padding:6px 0"><input type="checkbox" data-k="'+k+'"'+(s.tabs[k]!==0?" checked":"")+' style="width:22px;height:22px"> '+TABS[k]+"</label>").join("")+'</div><div class="bx">'+pform()+'</div>'
+'<div class="bx"><h3>Your data</h3><p class="mu">Saved on this device. Account sync: '+SY.st+'.</p><div class="row"><button class="g" id="ex">Export</button><button class="g" id="so">Sign out</button><button class="g" id="rs">Delete all</button></div><p id="e" class="mu"></p></div>');
pbind();$("#th").onchange=e=>{s.theme=e.target.value;save();theme()};$("#ac").oninput=e=>{s.acc=e.target.value;save();theme()};$("#un").onchange=e=>{s.units=e.target.value;save()};$("#pf").onchange=e=>{s.proof=e.target.checked?1:0;save()};
$$("[data-k]").forEach(c=>c.onchange=()=>{s.tabs[c.dataset.k]=c.checked?1:0;if(!Object.values(s.tabs).some(Boolean)){s.tabs.rate=1;c.checked=c.dataset.k==="rate"}save();go("set")});

$("#rs").onclick=()=>{if($("#rs").dataset.c){try{localStorage.removeItem("rook")}catch(e){}D=JSON.parse(JSON.stringify(DEF));save();theme();go("onb")}else{$("#rs").dataset.c=1;$("#rs").textContent="Tap again to confirm"}}};

theme();go(D.prof.done?"rate":"onb");
setTimeout(()=>{const e=$("#sp");if(e)e.remove()},2900);$("#sp").onclick=()=>$("#sp").remove();
</script>
<script type="module">
import{initializeApp}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import{getAuth,GoogleAuthProvider,signInWithPopup,signOut,onAuthStateChanged}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import{getFirestore,doc,getDoc,setDoc,collection,query,orderBy,limit,getDocs}from"https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";
const app=initializeApp(window.ROOK_CONFIG.firebase),auth=getAuth(app),fs=getFirestore(app),lg=document.getElementById("lg");
const sn=s=>({id:s.id,exists:s.exists(),data:()=>s.data()});
const db={doc:p=>({get:async()=>sn(await getDoc(doc(fs,p))),set:d=>setDoc(doc(fs,p),d)}),
collection:p=>{let o=null,l=50;const q={orderBy:(f,d)=>{o=[f,d];return q},limit:n=>{l=n;return q},
get:async()=>{const r=await getDocs(query(collection(fs,p),...(o?[orderBy(o[0],o[1])]:[]),limit(l)));return{docs:r.docs.map(d=>({id:d.id,data:()=>d.data()}))}}};return q}};
document.getElementById("gs").onclick=async()=>{try{await signInWithPopup(auth,new GoogleAuthProvider())}catch(e){document.getElementById("le").textContent="Sign-in failed ("+(e.code||"error")+")."}};
document.getElementById("ns").onclick=()=>{lg.hidden=true};
document.addEventListener("click",e=>{if(e.target.id==="so")signOut(auth).then(()=>location.reload())});
onAuthStateChanged(auth,u=>{if(u){lg.hidden=true;window.setAI(window.makeAI(u));window.startSync(db,u.uid)}else{window.setAI(null);lg.hidden=false}});
</script>
