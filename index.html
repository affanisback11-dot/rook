let S=null;window.setAI=f=>{S=f};
window.makeAI=user=>{const f=async(input,o={})=>{const tok=await user.getIdToken();
let m=(typeof input==="string"?[{role:"user",content:input}]:input).map(x=>({role:x.role,content:x.content}));
if(o.images&&o.images.length){const l=m[m.length-1],p=[];for(const b of o.images)p.push({type:"image",source:{type:"base64",media_type:"image/jpeg",data:(await b64(b)).split(",")[1]}});p.push({type:"text",text:l.content});l.content=p}
let r;try{r=await fetch(window.ROOK_CONFIG.aiUrl,{method:"POST",headers:{"content-type":"application/json",authorization:"Bearer "+tok},body:JSON.stringify({messages:m})})}catch(e){throw{code:"error",detail:"Network: "+e.message}}
if(r.status===429)throw{code:"rate_limited"};if(!r.ok){let t="";try{t=(await r.text()).slice(0,300)}catch(e){}throw{code:"error",detail:"HTTP "+r.status+" "+t}}
const d=await r.json();if(o.onText)o.onText({text:d.text});return{text:d.text}};
f.limits=async()=>({images:true});return f};
const SY={ref:null,tref:null,st:"local only",t:null};
function push(){if(!SY.ref)return;clearTimeout(SY.t);SY.t=setTimeout(async()=>{try{let th=JSON.stringify(D.scores.slice(-20).map(x=>x.thumb));if(th.length>200000)th=JSON.stringify(D.scores.slice(-10).map(x=>x.thumb));const l=JSON.parse(JSON.stringify(D));l.scores=l.scores.map(x=>Object.assign({},x,{thumb:""}));await SY.ref.set({d:JSON.stringify(l),ts:D.ts});await SY.tref.set({th});SY.st="on"}catch(e){SY.st="failed"}},1500)}
window.startSync=async(db,id)=>{try{
SY.db=db;SY.id=id;SY.ref=db.doc("data/users/"+id+"/main");SY.tref=db.doc("data/users/"+id+"/thumbs");const s=await SY.ref.get();
if(s.exists&&s.data().ts>(D.ts||0)){const r=JSON.parse(s.data().d);let th=[];try{const t=await SY.tref.get();if(t.exists)th=JSON.parse(t.data().th)}catch(e){}
const off=r.scores.length-th.length;r.scores.forEach((x,i)=>{x.thumb=th[i-off]||""});r.ts=s.data().ts;D=Object.assign({},DEF,r);try{localStorage.setItem("rook",JSON.stringify(D))}catch(e){}theme();go(D.prof.done?(cur==="onb"?"rate":cur):"onb")}

/* profile form (onboarding + settings) */

function pform(){const p=D.prof,o=(a,v)=>a.map(x=>"<option"+(String(x)===String(v)?" selected":"")+">"+x+"</option>").join("");

$$("[data-g]").forEach(b=>b.onclick=()=>{const g=b.dataset.g;p.goals=p.goals.includes(g)?p.goals.filter(x=>x!==g):[...p.goals,g];b.classList.toggle("on");save()});

V_.rate=()=>{

$$("[data-c]").forEach(b=>b.onclick=()=>
