<style>
:root{--bg:#E9ECE6;--sf:#fff;--ink:#14181F;--mu:#5B6472;--ln:#D3D8CE;--acc:#1E7F5C;--ai:#fff;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0D1117;--sf:#161B24;--ink:#ECEFF4;--mu:#97A1B3;--ln:#262E3C}}
:root[data-theme="dark"]{--bg:#0D1117;--sf:#161B24;--ink:#ECEFF4;--mu:#97A1B3;--ln:#262E3C}
*{box-sizing:border-box}html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:14px 16px}
h1,h2,h3{font-family:Archivo,system-ui,sans-serif;margin:0 0 8px;line-height:1.1}
h1{font-size:28px;font-weight:800}h2{font-size:24px;font-weight:800}h3{font-size:17px;font-weight:700;margin-top:6px}
p{margin:0 0 10px}.mu{color:var(--mu);font-size:14px}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
header div{display:flex;gap:6px}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--ink);background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:10px 12px;width:100%;margin-bottom:8px}
button{font:inherit;font-weight:600;cursor:pointer;border:0;border-radius:10px;padding:11px 15px;background:var(--acc);color:var(--ai)}
button.g{background:transparent;color:var(--ink);border:1px solid var(--ln)}button.s{padding:7px 11px;font-size:14px}
button:disabled{opacity:.5}:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.bx{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--sf);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom,0px);z-index:5}
nav button{flex:1;background:none;color:var(--mu);border-radius:0;padding:15px 1px;font-size:12px}
nav button[aria-current=true]{color:var(--acc);box-shadow:inset 0 3px 0 var(--acc)}
.sc{font-family:Archivo,system-ui,sans-serif;font-weight:800;font-size:84px;line-height:1;letter-spacing:-.04em;color:var(--acc)}
.sc small{font-size:20px;color:var(--mu);font-weight:500}
